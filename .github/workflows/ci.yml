name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history so leaks in any commit are caught
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
            backend/requirements-dev.txt

      - name: Install dependencies and security tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff==0.12.11 pip-audit==2.9.0 bandit==1.9.4

      - name: Dependency audit
        working-directory: backend
        run: pip-audit -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app/

      - name: Static security scan
        working-directory: backend
        run: bandit -q -r app -x app/tests

      - name: Tests
        working-directory: backend
        env:
          OPENAI_API_KEY: ""
          PINECONE_API_KEY: ""
          NEWS_API_KEY: ""
        run: pytest -q

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

      - name: Tests
        working-directory: frontend
        run: npm test

  docker:
    name: Docker images build cleanly
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
          load: true
          tags: verdict-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: verdict-frontend:ci
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: verdict-backend:ci
          scanners: vuln
          format: json
          output: backend-vulnerabilities.json
          exit-code: '0'
      - name: Scan frontend runtime image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: verdict-frontend:ci
          scanners: vuln
          format: json
          output: frontend-vulnerabilities.json
          exit-code: '0'
      - name: Reject fixable high and critical image vulnerabilities
        run: |
          trivy image --scanners vuln --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL verdict-backend:ci
          trivy image --scanners vuln --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL verdict-frontend:ci
      - name: Keep image vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-vulnerabilities
          path: '*-vulnerabilities.json'
      - name: Integrated production smoke test
        run: python scripts/verify_release.py --backend-image verdict-backend:ci --frontend-image verdict-frontend:ci
