# Layer onto docker-compose.yml for hot-reload development:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Allow backend/.env to hold local provider credentials. When present it
    # overrides the root .env; when absent the documented root setup still works.
    env_file:
      - path: .env
      - path: backend/.env
        required: false
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
      - verdict-db:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      disable: true
