# Only the loopback-bound frontend should be reachable by the TLS terminator.
# The edge must overwrite X-Forwarded-Proto and append the actual client IP.
map $http_x_forwarded_proto $verdict_forwarded_proto {
    default $scheme;
    https https;
}
map "$http_host:$uri" $verdict_local_redirect {
    default 0;
    ~^127\.0\.0\.1:8080:/healthz$ 0;
    ~^127\.0\.0\.1:8080: 1;
}
log_format verdict '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Local Google sign-in is registered for localhost, not its IP alias.
    if ($verdict_local_redirect) {
        return 307 http://localhost:8080$request_uri;
    }

    access_log /dev/stdout verdict;
    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;

    # GIS injects button styles. Inline styles are allowed; scripts remain restricted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    location ~* ^/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # API proxy + SSE-friendly settings
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $verdict_forwarded_proto;
        proxy_hide_header Server;

        # Streaming endpoints (SSE) need no buffering and a long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 300s;
    }
}
