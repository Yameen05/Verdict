# Gitleaks configuration — extends the default ruleset.
[extend]
useDefault = true

# Allow only the documented bootstrap placeholder, not the entire example file.
# A real credential accidentally pasted into .env.example must still fail CI.
[[allowlists]]
description = "Documented bootstrap placeholder"
condition = "AND"
paths = ['''(^|/)\.env\.example$''']
regexTarget = "secret"
regexes = ['''^replace-me-with-a-random-one-time-bootstrap-token$''', '''^STOCKTWITS_ENABLED(?:=true)?$''']
